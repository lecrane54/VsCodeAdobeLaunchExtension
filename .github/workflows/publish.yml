name: Publish

# Push a version tag to publish the extension:
#   1. bump "version" in package.json (e.g. 0.13.0) and commit
#   2. git tag v0.13.0 && git push origin v0.13.0
#
# The same .vsix goes to the VS Code Marketplace (so installs auto-update),
# to Open VSX when an OVSX_PAT secret is set (Cursor, VSCodium, …), and to a
# GitHub Release. Each publish skips a version that's already up, so a failed
# run can simply be re-run.
#
# Marketplace auth is Trusted Publishing (OIDC): GitHub vouches for this
# workflow, so no Marketplace token is stored anywhere. Set it up once in the
# `lecrane` publisher's Trusted Publishing tab at
# https://marketplace.visualstudio.com/manage with:
#   Repository owner: lecrane54
#   Repository:       VsCodeAdobeLaunchExtension
#   Workflow:         publish.yml
#   Environment:      (blank)
# (Azure DevOps "All accessible organizations" PATs, the old VSCE_PAT route,
# stop working on December 1, 2026.)
#
# Secrets (Settings → Secrets and variables → Actions):
#   OVSX_PAT  optional — Open VSX token for the `lecrane` namespace
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload the .vsix
  id-token: write # let vsce exchange GitHub's OIDC token for a Marketplace one

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A v0.13.0 tag on a package.json still saying 0.12.0 would publish a
      # .vsix that installs as the wrong version. Stop before building it.
      - name: Check tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg. Bump the version, commit, and re-tag."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Compile and test
        run: npm test

      # Relative README links are rewritten to GitHub URLs (from `repository`
      # in package.json) so they work on the Marketplace page.
      - name: Package extension
        run: npx vsce package --no-dependencies -o "launch-tags-editor-${GITHUB_REF_NAME}.vsix"

      # Fails with an authentication error until the Trusted Publishing policy
      # above exists on the publisher.
      - name: Publish to VS Code Marketplace
        run: npx vsce publish --oidc --packagePath "launch-tags-editor-${GITHUB_REF_NAME}.vsix" --skip-duplicate

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT not set; skipping Open VSX."
            exit 0
          fi
          npx --yes ovsx@0.10.1 publish "launch-tags-editor-${GITHUB_REF_NAME}.vsix" --skip-duplicate

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "launch-tags-editor-${GITHUB_REF_NAME}.vsix" \
            --title "Launch Tags Editor $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
